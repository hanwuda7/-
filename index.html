<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f5d68" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="课程表" />
    <meta
      name="description"
      content="2026-2027学年第一学期手机课程表"
    />
    <title>手机课程表</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="header-topline">
          <p class="eyebrow" id="semesterTitle">2026-2027学年 第一学期</p>
          <button class="install-button" id="installButton" type="button" hidden>
            安装到桌面
          </button>
        </div>

        <div class="week-overview">
          <div>
            <p class="week-kicker" id="termStatus">当前学期</p>
            <h1 id="weekHeading">第 1 周</h1>
          </div>
          <p class="date-range" id="dateRange">8月31日 — 9月6日</p>
        </div>

        <div class="week-navigation" aria-label="周次切换">
          <button class="nav-button" id="previousWeek" type="button" aria-label="上一周">
            <span aria-hidden="true">←</span>
            <span>上一周</span>
          </button>
          <button class="today-button" id="todayButton" type="button">回到本周</button>
          <button class="nav-button nav-button-next" id="nextWeek" type="button" aria-label="下一周">
            <span>下一周</span>
            <span aria-hidden="true">→</span>
          </button>
        </div>

        <div class="next-class" id="nextClass" aria-live="polite">
          正在计算下一节课…
        </div>
      </header>

      <main>
        <section class="week-strip-wrap" aria-label="星期选择">
          <div class="week-strip" id="weekStrip"></div>
        </section>

        <section class="schedule-panel" id="schedulePanel" aria-label="当日课程">
          <div class="day-heading">
            <div>
              <p class="section-label">当日课程</p>
              <h2 id="dayHeading">星期一</h2>
            </div>
            <p class="day-date" id="dayDate"></p>
          </div>

          <div class="timeline" id="scheduleList"></div>
        </section>

        <details class="data-notice" id="dataNotice">
          <summary>
            <span>数据说明</span>
            <span class="notice-count" id="noticeCount"></span>
          </summary>
          <div class="notice-content" id="noticeContent"></div>
        </details>
      </main>

      <footer class="app-footer">
        <p>左右滑动日期条或课程区域可切换周次。</p>
        <p id="conflictSummary" class="conflict-summary"></p>
      </footer>
    </div>

    <dialog class="course-dialog" id="courseDialog">
      <div class="dialog-handle" aria-hidden="true"></div>
      <div class="dialog-header">
        <div>
          <p class="section-label">课程详情</p>
          <h2 id="dialogCourseName"></h2>
        </div>
        <button class="icon-button" id="closeDialog" type="button" aria-label="关闭课程详情">
          ×
        </button>
      </div>
      <div class="dialog-content" id="dialogContent"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./data/courses.data.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
